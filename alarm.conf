# ==============================================================================
# alarm.conf — Arch Linux ARM Raspberry Pi 5 Image Builder Configuration
# ==============================================================================
# Values in alarm.conf override defaults. Command-line flags take top precedence.
# Standard POSIX / UNIX variable names are used. Legacy aliases are supported.
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. System Identity & Hostname
# ------------------------------------------------------------------------------
# System hostname (alias: TARGET_HOSTNAME)
HOSTNAME="${HOSTNAME:-${TARGET_HOSTNAME:-raspberrypi}}"
# Target image version (defaults to root VERSION file if present)
VERSION="${VERSION:-$(tr -d ' \r\n' <"$(dirname "${BASH_SOURCE[0]}")/VERSION" 2>/dev/null || echo "1.1.0-snapshot")}"

# ------------------------------------------------------------------------------
# 2. User Credentials & Accounts
# ------------------------------------------------------------------------------
# Root administrative account
ROOT_USER="${ROOT_USER:-root}"
ROOT_PASSWORD="${ROOT_PASSWORD:-root}"

# Non-root user (automatically added to 'wheel' group for sudo privileges)
# Can be any valid username (e.g. "alarm", "pi", "arch", "admin", "vikram")
# (aliases: ALARM_USER, NON_ROOT_USER)
USERNAME="${USERNAME:-${ALARM_USER:-${NON_ROOT_USER:-alarm}}}"
PASSWORD="${PASSWORD:-${ALARM_PASSWORD:-alarm}}"

# ------------------------------------------------------------------------------
# 3. Localization & Time (POSIX Standard: TZ & LANG)
# ------------------------------------------------------------------------------
# System timezone (alias: TIMEZONE)
TZ="${TZ:-${TIMEZONE:-Asia/Kolkata}}"

# System locale (alias: LOCALE)
LANG="${LANG:-${LOCALE:-en_US.UTF-8}}"

# ------------------------------------------------------------------------------
# 4. Packages
# ------------------------------------------------------------------------------
# Additional packages to install into rootfs via pacman (space-separated).
# (alias: EXTRA_PACKAGES)
# Base packages already installed: base, linux-rpi, firmware-raspberrypi,
# raspberrypi-bootloader, archlinuxarm-keyring, openssh, sudo, nano, e2fsprogs,
# parted, git, tmux, zsh, curl, wget, unzip.
# Example: PACKAGES="htop neovim bash-completion"
PACKAGES="${PACKAGES:-${EXTRA_PACKAGES:-git curl wget vim neovim tmux zsh}}"

# ------------------------------------------------------------------------------
# 5. Disk & Filesystem Layout
# ------------------------------------------------------------------------------
# Raw disk image size (alias: IMG_SIZE)
# (3G, 4G, 8G, etc. — 3G gives ~1.8GB free headroom and fits on any SD card >=4GB)
IMAGE_SIZE="${IMAGE_SIZE:-${IMG_SIZE:-3G}}"

# Boot partition size in MiB (FAT32 EFI/boot, alias: BOOT_SIZE_MIB)
BOOT_SIZE="${BOOT_SIZE:-${BOOT_SIZE_MIB:-256M}}"

# Compress image using xz -9 (1 = enabled, 0 = disabled raw .img)
COMPRESS="${COMPRESS:-1}"

# Output directory for generated images
OUTPUT_DIR="${OUTPUT_DIR:-./dist}"

# ALARM package repository mirror (alias: ALARM_MIRROR)
MIRROR="${MIRROR:-${ALARM_MIRROR:-http://mirror.archlinuxarm.org}}"
