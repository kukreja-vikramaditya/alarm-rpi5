name: Build & Publish ALARM Raspberry Pi 5 Image

on:
  push:
    branches:
      - main
      - 'test/**'
      - 'fix/**'
      - 'ci/**'
    tags:
      - 'v*'
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - '.dockerignore'
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - '.dockerignore'
  workflow_dispatch:
    inputs:
      test_only:
        description: 'Test build only (skip release publishing)'
        type: boolean
        default: true
      no_compress:
        description: 'Skip compression for faster test verification'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  test:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Arch Linux builder container
        run: docker build -t alarm-rpi5-builder .

      - name: Run test suites inside Arch Linux container (10 suites)
        run: |
          docker run --rm \
            --entrypoint ./tests/run_all.sh \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -w /workspace \
            alarm-rpi5-builder

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-failure-logs
          path: |
            tests/*.log
            *.log
          if-no-files-found: ignore
          retention-days: 7

  build:
    name: Build & Publish Image
    needs: test
    if: |
      github.event_name != 'pull_request' &&
      !contains(github.event.head_commit.message, '[skip build]') &&
      !contains(github.event.head_commit.message, '[skip image]')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          echo "Freeing disk space on runner..."
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          df -h /

      - name: Set up QEMU binfmt emulation
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Prepare loop devices on host
        run: |
          echo "Loading loop kernel module..."
          sudo modprobe loop max_part=8 || true
          ls -la /dev/loop* || true

      - name: Compute Release Version & Metadata
        id: meta
        run: |
          RAW_VER="$(tr -d ' \r\n' < VERSION 2>/dev/null || echo '1.1.0-snapshot')"
          # Strip -snapshot or -SNAPSHOT if present for clean release artifact
          CLEAN_VER="${RAW_VER%-snapshot}"
          CLEAN_VER="${CLEAN_VER%-SNAPSHOT}"

          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            TAG_VER="${{ github.ref_name }}"
            BUILD_VER="${TAG_VER#v}"
            echo "version=${BUILD_VER}" >> "$GITHUB_OUTPUT"
            echo "tag_name=${TAG_VER}" >> "$GITHUB_OUTPUT"
            echo "release_name=Release ${TAG_VER}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${CLEAN_VER}" >> "$GITHUB_OUTPUT"
            echo "tag_name=latest" >> "$GITHUB_OUTPUT"
            echo "release_name=Release v${CLEAN_VER} (${{ github.sha }})" >> "$GITHUB_OUTPUT"
          fi

      - name: Build ALARM image inside Arch Linux container
        run: |
          set -o pipefail
          echo "==> Building container builder image from Dockerfile..."
          docker build -t alarm-rpi5-builder . 2>&1 | tee docker-build.log

          BUILD_FLAGS=("-y" "--version" "${{ steps.meta.outputs.version }}")
          if [[ "${{ inputs.no_compress }}" == "true" ]]; then
            echo "==> Fast test verification requested: disabling xz compression..."
            BUILD_FLAGS+=("--no-compress")
          fi

          echo "==> Running ALARM image build inside container with version ${{ steps.meta.outputs.version }}..."
          docker run --rm --privileged \
            -v /dev:/dev \
            -v /sys:/sys \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -w /workspace \
            alarm-rpi5-builder "${BUILD_FLAGS[@]}" 2>&1 | tee image-build.log

      - name: Push failure log on error
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan ci-debug-log || git checkout ci-debug-log
          git rm -rf . || true
          {
            echo "================================================="
            echo "DOCKER BUILD LOG"
            echo "================================================="
            cat docker-build.log 2>&1 || true
            echo ""
            echo "================================================="
            echo "IMAGE BUILD LOG"
            echo "================================================="
            cat image-build.log 2>&1 || true
          } > failure-log.txt
          git add failure-log.txt
          git commit -m "ci: capture failure logs [skip ci]" || true
          git push -f origin ci-debug-log || true

      - name: Generate SHA-256 Checksums
        id: checksums
        run: |
          sudo chown -R "$(id -u):$(id -g)" dist
          sudo chmod -R 755 dist
          cd dist
          sha256sum *.img* > SHA256SUMS
          cat SHA256SUMS
          IMAGE_FILE="$(ls *.img* | grep -v 'SHA256SUMS' | head -n 1)"
          echo "image_file=${IMAGE_FILE}" >> "$GITHUB_OUTPUT"

      - name: Verify ALARM image partition and filesystem structure
        run: |
          cd dist
          RAW_IMG="$(ls *.img 2>/dev/null | head -n 1 || true)"
          if [[ -n "$RAW_IMG" && -f "$RAW_IMG" ]]; then
            echo "==> Inspecting partition table of uncompressed image ${RAW_IMG}..."
            parted -s "${RAW_IMG}" print
            echo "==> Checking partition labels with blkid..."
            LDEV="$(sudo losetup --find --show -P "${RAW_IMG}")"
            sudo lsblk -f "${LDEV}"
            sudo blkid "${LDEV}p1" | grep -q 'LABEL="BOOT"'
            sudo blkid "${LDEV}p2" | grep -q 'LABEL="ROOT"'
            echo "==> Mounting partitions to verify core boot and system files..."
            MNT_DIR="$(mktemp -d)"
            sudo mount "${LDEV}p2" "${MNT_DIR}"
            sudo mount "${LDEV}p1" "${MNT_DIR}/boot"
            ls -la "${MNT_DIR}/boot"
            test -f "${MNT_DIR}/boot/cmdline.txt"
            test -f "${MNT_DIR}/boot/config.txt"
            test -f "${MNT_DIR}/boot/initramfs-linux.img"
            test -f "${MNT_DIR}/boot/vmlinuz-linux"
            test -f "${MNT_DIR}/etc/fstab"
            test -f "${MNT_DIR}/etc/hostname"
            sudo umount "${MNT_DIR}/boot"
            sudo umount "${MNT_DIR}"
            sudo losetup -d "${LDEV}"
            rmdir "${MNT_DIR}"
            echo "==> Verified: Arch Linux ARM installation and partition structure is intact!"
          else
            echo "==> Compressed image artifact: ${{ steps.checksums.outputs.image_file }}"
            file "${IMAGE_FILE}" || true
          fi

      - name: Upload Artifact to Workflow Run
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.checksums.outputs.image_file }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish to GitHub Releases
        if: |
          github.event_name != 'pull_request' &&
          (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) &&
          (github.event_name != 'workflow_dispatch' || inputs.test_only != true)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag_name }}
          name: ${{ steps.meta.outputs.release_name }}
          prerelease: false
          make_latest: true
          body: |
            ## Arch Linux ARM for Raspberry Pi 5

            Automated image build generated from commit [`${{ github.sha }}`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}).

            ### Checksums (SHA-256)
            ```text
            $(cat dist/SHA256SUMS)
            ```

            ### How to Flash
            1. Download the `.img.xz` file from Assets below.
            2. Launch **[Raspberry Pi Imager](https://www.raspberrypi.com/software/)**.
            3. Click **Choose OS** → scroll to the bottom → **Use custom** → select the `.img.xz` file.
            4. Click **Choose Storage** → pick your SD card → click **Write**.
            5. Insert the card into your Raspberry Pi 5, connect Ethernet, and power on!

            ### Default Credentials
            | Account | Username | Password | Privileges |
            | :--- | :--- | :--- | :--- |
            | **Standard User** | `alarm` | `alarm` | `wheel` (`sudo` privileges) |
            | **Root User** | `root` | `root` | Superuser / Administrator |
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
