# Created for Arch Linux ARM Raspberry Pi 5 Image Builder
# Project: https://github.com/kukreja-vikramaditya/alarm-rpi5

[options]
HoldPkg     = pacman glibc
Architecture = aarch64
CheckSpace
SigLevel    = Never
DisableSandbox

[core]
Server = @ALARM_MIRROR@/$arch/$repo

[extra]
Server = @ALARM_MIRROR@/$arch/$repo

[alarm]
Server = @ALARM_MIRROR@/$arch/$repo

[aur]
Server = @ALARM_MIRROR@/$arch/$repo
